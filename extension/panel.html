<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网申助手 · 悬浮面板</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="panel.css"></head>
<body class="side-panel">
<header class="panel-header"><div class="panel-brand"><div class="brand-icon" aria-hidden="true">申</div><div><h1>网申助手 <span class="badge">0.4.0</span></h1><p>把重复填写，交给准备好的资料</p></div></div><div class="window-actions"><button id="collapse-panel" class="window-button" title="收起助手，保留侧边把手" aria-label="收起助手"><span aria-hidden="true">−</span></button><button id="close-panel" class="window-button close-button" title="关闭助手；可点击浏览器工具栏图标重新打开" aria-label="关闭助手"><span aria-hidden="true">×</span></button></div></header>
<main>
  <div class="section-eyebrow"><span>当前资料</span><button id="manage" class="subtle">资料库 ↗</button></div>
  <div class="profile-picker"><select id="profile" aria-label="岗位资料版本"></select><button id="import-materials" class="secondary">导入材料</button></div>
  <div class="tabbar" role="tablist" aria-label="填写方式"><button id="tab-quick" class="selected" role="tab" aria-selected="true" aria-controls="quick-view">复制 / 插入</button><button id="tab-batch" role="tab" aria-selected="false" aria-controls="batch">识别批量填写</button></div>
  <p id="status" role="status" aria-live="polite">使用者自行导入材料，核对后使用。</p>
  <div class="panel-settings"><label>宽度 <select id="panel-width" aria-label="面板宽度"><option value="320">窄 · 320</option><option value="374" selected>标准 · 374</option><option value="440">宽 · 440</option><option value="520">加宽 · 520</option></select></label><label><input id="compact" type="checkbox"> 紧凑模式</label><a href="help.html" target="_blank" rel="noopener">使用教程 ↗</a></div>
  <div id="quick-view">
    <div class="target-box"><strong id="target">目标：先点击网页输入框</strong><select id="insert-mode" aria-label="插入方式"><option value="replace">替换整个字段</option><option value="cursor">插入光标 / 替换选中内容</option></select><button id="quick-undo" class="subtle">撤销上次填写</button></div>
    <section id="recommendations" class="recommendations" aria-label="当前输入框推荐资料" hidden><h2>当前输入框推荐</h2><div id="recommended-cards"></div><p class="tiny muted">在面板内按 Alt + Enter 插入唯一的非敏感推荐；多条推荐需手动选择。</p></section>
    <div class="search-field"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索姓名、学校、项目…" aria-label="搜索资料"></div>
    <div class="card-filters">
    <select id="category" aria-label="资料分类"><option value="">全部分类</option></select>
    <select id="quick-filter" aria-label="快捷筛选"><option value="all">全部资料</option><option value="pinned">常用置顶</option><option value="recent">最近使用</option></select>
    </div>
    <div id="cards" class="quick-cards"></div>
    <details id="workbench" class="workbench"><summary>编辑与 AI 精简工作区</summary>
      <textarea id="draft" rows="6" maxlength="15000" aria-label="当前编辑内容" placeholder="点击资料卡上的“编辑”，或直接输入临时文字"></textarea><div id="count" class="muted">0 字符</div><div id="draft-status" class="tiny muted" role="status"></div>
      <div class="toolbar"><button id="draft-copy" class="secondary">复制</button><button id="draft-insert" class="primary">插入</button></div>
      <div class="toolbar"><select id="variant-label" aria-label="文字版本名称"><option>短版</option><option>标准版</option><option>详细版</option></select><button id="save-variant" class="secondary">保存文字版本</button></div><p class="tiny muted">先从资料卡点“编辑”，再保存为该字段的文字版本；原资料保留。</p>
      <label class="ai-limit">目标字符数 <input id="limit" type="number" min="1" max="5000" value="300"></label>
      <p class="muted tiny">仅发送上面这段文字到你配置的 AI 接口。结果先核对，再采用。</p>
      <button id="ai-shorten" class="secondary">生成 AI 精简建议</button><button id="ai-cancel" class="subtle" hidden>取消</button>
      <textarea id="ai-result" rows="5" aria-label="AI 精简建议" placeholder="精简结果，不会自动填入网页或资料库"></textarea><button id="ai-adopt" class="secondary">采用到工作区</button>
    </details>
    <details class="application-note"><summary>记录本次投递</summary><input id="company" placeholder="公司" aria-label="投递公司"><input id="job" placeholder="岗位" aria-label="投递岗位"><select id="application-status" aria-label="投递状态"><option>准备中</option><option>已投递</option><option>笔试</option><option>面试</option><option>录用</option><option>未通过</option></select><input id="application-date" type="date" aria-label="投递日期"><button id="save-application" class="secondary">保存投递记录</button><p class="tiny muted">状态由你选择，填入资料不会自动记为已投递。</p></details>
  </div>
  <iframe id="batch" title="批量识别面板" hidden></iframe>
</main>
<script src="schema.js"></script><script src="storage.js"></script><script src="library.js"></script><script src="ux.js"></script><script src="ai.js"></script><script src="panel.js"></script>
</body></html>
