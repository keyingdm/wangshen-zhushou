<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网申助手 0.2 · 悬浮面板试用</title><link rel="stylesheet" href="../extension/styles.css"><link rel="stylesheet" href="v2.css"></head><body>
<header class="demo-header"><div class="brand-icon">申</div><div><h1>网申助手 0.2 <span class="badge">本机试用</span></h1><p>右侧面板使用正式插件代码。示例资料为虚构，仅用于体验。</p></div><button id="sample" class="secondary">加载虚构示例资料</button><button id="empty" class="subtle">清空演示资料</button><a href="../extension/options.html" target="_blank">导入材料 / 资料库 ↗</a></header>
<div class="v2-layout"><nav id="nav"><button data-section="basic" class="active">个人信息</button><button data-section="education">教育经历</button><button data-section="certificates">资格证书</button><button data-section="work">工作经历</button><button data-section="family">家庭成员</button><button data-section="achievements">取得成果</button><button data-section="awards">奖惩情况</button><button data-section="projects">项目 / 实习</button><button data-section="text">爱好与评价</button><button data-section="declarations">资格声明 / 考试</button></nav>
<main class="v2-form"><div class="notice">先点击网页输入框，再点右侧资料卡“插入”。“加载虚构示例资料”只影响本机演示，正式插件初始为空。</div>
<form id="form" autocomplete="off">
<fieldset id="basic" data-section="个人信息"><legend>个人信息</legend>
<div class="form-item"><label for="name">姓名</label><input id="name" autocomplete="name"></div><div class="form-item"><label for="gender">性别</label><select id="gender"><option value="">请选择</option><option value="M">男</option><option value="F">女</option></select></div>
<div class="form-item"><label for="ethnicity">民族</label><input id="ethnicity"></div><div class="form-item"><label for="birthday">出生日期</label><input id="birthday" type="date"></div><div class="form-item"><label for="political">政治面貌</label><input id="political"></div><div class="form-item"><label for="party">入党时间</label><input id="party" type="date"></div>
<div class="form-item"><label>籍贯</label><div class="region"><select id="hometown-province"><option value="">请选择省份</option><option value="province-a">演示省A</option></select><select id="hometown-city"><option value="">请选择城市</option><option value="city-a">演示市A</option></select></div></div>
<div class="form-item"><label>现户口所在</label><div class="region"><select id="household-province"><option value="">请选择省份</option><option value="province-a">演示省A</option></select><select id="household-city"><option value="">请选择城市</option><option value="city-a">演示市A</option></select></div></div>
<div class="form-item"><label>生源所在地</label><div class="region"><select id="origin-province"><option value="">请选择省份</option><option value="province-a">演示省A</option></select><select id="origin-city"><option value="">请选择城市</option><option value="city-a">演示市A</option></select></div></div>
<div class="form-item"><label for="marital">婚姻状况</label><input id="marital"></div><div class="form-item"><label for="id-type">证件类型</label><input id="id-type"></div><div class="form-item"><label for="id-number">证件号码</label><input id="id-number"></div><div class="form-item"><label for="language1">外国语种1</label><input id="language1"></div><div class="form-item"><label for="language-level1">外语水平1</label><input id="language-level1"></div><div class="form-item"><label for="phone">联系电话</label><input id="phone" type="tel" autocomplete="tel"></div><div class="form-item"><label for="email">电子邮箱</label><input id="email" type="email" autocomplete="email"></div><div class="form-item"><label for="emergency-name">紧急联系人</label><input id="emergency-name"></div><div class="form-item"><label for="emergency-phone">紧急电话</label><input id="emergency-phone" type="tel"></div><div class="form-item"><label for="health">健康状况</label><input id="health"></div><div class="form-item"><label for="height">身高</label><input id="height" type="number"></div><div class="form-item"><label for="weight">体重</label><input id="weight" type="number"></div>
</fieldset>
<fieldset id="education" data-section="教育经历" hidden><legend>教育经历</legend><div class="form-item"><label for="school">院校名称</label><input id="school"></div><div class="form-item"><label for="major">专业</label><input id="major"></div><div class="form-item"><label for="mode">形式</label><input id="mode"></div><div class="form-item"><label for="qualification">学历</label><select id="qualification"><option value="">请选择</option><option value="bachelor">大学本科</option></select></div><div class="form-item"><label for="degree">学位</label><input id="degree"></div><div class="form-item"><label for="rank">班级或年级综合排名</label><input id="rank"></div><div class="form-item"><label for="edu-start">入学时间</label><input id="edu-start" type="month"></div><div class="form-item"><label for="edu-end">预计毕业时间</label><input id="edu-end" type="month"></div></fieldset>
<fieldset id="projects" data-section="项目经历" hidden><legend>项目 / 实习经历</legend><div class="form-item"><label for="project-name">项目名称</label><input id="project-name"></div><div class="form-item"><label for="project-start">开始时间</label><input id="project-start" type="month"></div><div class="form-item"><label for="project-end">结束时间</label><input id="project-end" type="month"></div><div class="form-item wide"><label for="project-description">项目描述</label><textarea id="project-description" rows="5"></textarea></div><div class="form-item wide"><label for="project-responsibility">责任描述</label><textarea id="project-responsibility" rows="6"></textarea></div><div class="form-item wide"><label for="project-results">项目成果</label><textarea id="project-results" rows="4"></textarea></div></fieldset>
<fieldset id="family" data-section="家庭成员" hidden><legend>家庭成员</legend><div class="form-item"><label for="relation">与本人关系</label><input id="relation"></div><div class="form-item"><label for="family-name">姓名</label><input id="family-name"></div><div class="form-item"><label for="family-unit">工作单位</label><input id="family-unit"></div><div class="form-item"><label for="family-role">职务</label><input id="family-role"></div></fieldset>
<fieldset id="certificates" data-section="资格证书" hidden><legend>资格证书</legend><div class="form-item"><label for="certificate-name">证书名称</label><input id="certificate-name"></div><div class="form-item"><label for="certificate-level">证书等级</label><input id="certificate-level"></div><div class="form-item"><label for="certificate-date">取得时间</label><input id="certificate-date" type="month"></div></fieldset>
<fieldset id="work" data-section="工作经历" hidden><legend>工作经历</legend><div class="form-item"><label for="company">公司名称</label><input id="company"></div><div class="form-item"><label for="work-role">职位名称</label><input id="work-role"></div><div class="form-item wide"><label for="work-description">工作内容</label><textarea id="work-description" rows="5"></textarea></div></fieldset>
<fieldset id="achievements" data-section="取得成果" hidden><legend>取得成果</legend><div class="form-item"><label for="achievement-name">成果名称</label><input id="achievement-name"></div><div class="form-item"><label for="achievement-status">成果状态</label><input id="achievement-status"></div><div class="form-item wide"><label for="achievement-description">成果描述</label><textarea id="achievement-description"></textarea></div></fieldset>
<fieldset id="awards" data-section="奖惩情况" hidden><legend>奖惩情况</legend><div class="form-item"><label for="award-name">奖惩名称</label><input id="award-name"></div><div class="form-item"><label for="award-rank">获奖等级</label><input id="award-rank"></div></fieldset>
<fieldset id="text" data-section="技能与长文本" hidden><legend>爱好特长 / 自我评价</legend><div class="form-item wide"><label for="hobbies">爱好特长</label><textarea id="hobbies" rows="5"></textarea></div><div class="form-item wide"><label for="evaluation">自我评价</label><textarea id="evaluation" rows="5"></textarea></div></fieldset>
<fieldset id="declarations" data-section="资格与声明" hidden><legend>资格声明 / 考试城市</legend><div class="form-item"><label for="avoidance">存在亲属回避情况</label><select id="avoidance"><option value="">请自己核对</option><option value="yes">是</option><option value="no">否</option></select></div><div class="form-item"><label for="employed">存在两年择业期已就业</label><select id="employed"><option value="">请自己核对</option><option value="yes">是</option><option value="no">否</option></select></div><div class="form-item"><label for="exam-city1">首选考试城市</label><input id="exam-city1"></div><div class="form-item"><label for="exam-city2">备选考试城市</label><input id="exam-city2"></div></fieldset>
<p class="muted">这里只演示填写，不会提交到招聘网站。</p></form></main></div>
<script src="../extension/schema.js"></script><script src="../extension/storage.js"></script><script src="../extension/library.js"></script><script src="../extension/content.js"></script><script src="v2.js"></script>
</body></html>
